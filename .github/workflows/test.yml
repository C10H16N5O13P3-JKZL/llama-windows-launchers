name: test
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Windows PowerShell 5.1 is what the .bat entry points use.
      - name: Offline integration test (Windows PowerShell 5.1)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\test-backends.ps1
      - name: Scripts are ASCII-only
        shell: bash
        run: |
          if LC_ALL=C grep -n '[^[:print:][:space:]]' *.ps1 *.bat tools/*.ps1 tests/*.ps1; then
            echo "Non-ASCII characters break BOM-less scripts on Windows PowerShell 5.1"; exit 1
          fi
